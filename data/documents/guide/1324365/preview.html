<body><header><h1>내일 스포당하기 싫은 뉴비들및 할배들 필독</h1><p>원본: <a href="https://gall.dcinside.com/mgallery/board/view?id=gov&amp;no=1324365">https://gall.dcinside.com/mgallery/board/view?id=gov&amp;no=1324365</a><br>백업 시각: <time>2026-09-24T07:20:43.359Z</time></p></header><main><p></p><div><div>제일좋은건 내일 갤질을 안하는건데 그건 불가능하다 </div><br></div><p></p><div><img src="../../../assets/guide/1324365/149b0a7726744c3e619aeb1f6e9876ea0f3a5b25ada58047c1fac950eeac4223.jpg" alt="1ebec223e0dc2bae61abe9e74683706d2ea34883d2d1cbb2b6c8b52d5702bfa05b72c49274581dcc1f"></div><p></p><div><div>PC버전에서는 일반탭을 직접 눌러서 스포를 가리는법밖에 없다 </div><br><div>모바일버전은 </div></div><p></p><div><img src="../../../assets/guide/1324365/64f7acbc69848e4155bc75b55a5f0c190e792f5c0e0d9d1039557612df2eaa23.jpg" alt="1ebec223e0dc2bae61abe9e74683706d2ea34f83d2dfc9bab6c8b52d5702bfa03e745b615f970844cf"></div><p></p><div><div>우측상단 점 세게 클릭 후 말머리설정 </div><br></div><p></p><div><img src="../../../assets/guide/1324365/589abe0c2043ed86b3077b965ffe9a53b20d31dcfa8842c7d83fbe58c4936917.jpg" alt="1ebec223e0dc2bae61abe9e74683706d2ea34f83d2dfc9bab4c0b52d5702bfa0e2bb37a711d163aeeb"></div><p></p><div><div>여기에서 스포탭 체크를 해제 </div></div><p></p><div><img src="../../../assets/guide/1324365/b60271b437792566e29c396defac7bbcce244f9f3ea563e9dd4b24483a408f7a.jpg" alt="1ebec223e0dc2bae61abe9e74683706d2ea34f83d2dfc9bbb4c0b52d5702bfa0beb83985d5a68b0286"></div><p></p><div><div>그럼 스포탭 자체가 사라지게 된다 </div><br><div>참고로 내일은 갤러리 관리내역 안들어가는걸 추천함 </div></div></main></body></html>
