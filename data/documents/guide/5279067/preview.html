<body><header><h1>한눈에 보는 초화력 마앵덱 버스트 사이클</h1><p>원본: <a href="https://gall.dcinside.com/mgallery/board/view/?id=gov&amp;no=5279067">https://gall.dcinside.com/mgallery/board/view/?id=gov&amp;no=5279067</a><br>백업 시각: <time>2026-09-24T07:09:36.220Z</time></p></header><main><p><br></p><p><img src="../../../assets/guide/5279067/c9b0b7e530cade029a353074fda71114903a7e5bd376164a6c5c18b31fed876e.png" data-fileno="4113154" alt="24b0d121e09c28a8699fe8b115ef04699131f5"></p><p><br></p><p>색칠한 마스트는 3스택</p><p>일반적으로 레이드 3분간 14~15버스트라는걸 생각해보면 초화력+3스택은 2번 가능함</p><p><br></p><p><br></p><p><br></p><p><br></p><p><br></p><p><img src="../../../assets/guide/5279067/8d0437a5fb07366157df8a92e62d194b548718a5d954e41d1932d45dd7b533f7.png" data-fileno="4113155" alt="24b0d121e09c28a8699fe8b115ef0469933afe"></p><p><br></p><p>여기서 네온 초화력 딜을 더 뽑고싶으면 앵커 타버스트 선버로 첫 초화력에 마스트 2스택을 쓰는 방법이 있음</p><p>실제로 뭐가 더 셀지는 실전 가서 쳐봐야 알것같긴 함</p></main></body></html>
